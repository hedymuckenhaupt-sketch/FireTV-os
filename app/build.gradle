plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'de.muckenhaupt.chillzimmer'
    compileSdk 34

    defaultConfig {
        applicationId "de.muckenhaupt.chillzimmer"
        minSdk 22
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    // Fester Schlüssel, damit Updates einfach drüberinstalliert werden können
    signingConfigs {
        fest {
            storeFile file('../chillzimmer.keystore')
            storePassword 'chillzimmer'
            keyAlias 'chillzimmer'
            keyPassword 'chillzimmer'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fest }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false; checkReleaseBuilds false }
}
