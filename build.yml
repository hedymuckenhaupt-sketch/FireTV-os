name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK bauen
        run: gradle assembleRelease

      - name: Als Download „latest“ veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ChillzimmerLauncher.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ChillzimmerLauncher.apk \
            --title "Aktuelle Version" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}"
