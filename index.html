<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chillzimmer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 1rem = 1/96 der Bildschirmbreite (20 px bei Full HD) */
  html { font-size: calc(100vw / 96); background: #0d1016; color: #fff;
         font-family: Roboto, "Segoe UI", Arial, sans-serif; }
  body { height: 100vh; overflow: hidden; }
  button { background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; outline: none; }
  ::-webkit-scrollbar { display: none; }
  .layer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }

  /* Hintergrund: Bild + Abdunklung oben/unten für Lesbarkeit */
  #bg { background: #0d1016 center / cover no-repeat; }
  #shade { background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,0) 28%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45)); }

  .clock { position: fixed; top: 3.6rem; font-size: 1.9rem; font-weight: 300; letter-spacing: .02em;
           font-variant-numeric: tabular-nums; text-shadow: 0 .1rem .8rem rgba(0,0,0,.35); }
  .dock-mode .clock { left: 6rem; }
  .list-mode .clock { right: 6rem; }

  /* Glas: vorberechnete Unschärfe statt teurem Live-Blur */
  .glass { border: .1rem solid rgba(255,255,255,.16); border-radius: 1.8rem; background-color: rgba(255,255,255,.07); }
  .frost .glass { background-repeat: no-repeat; }

  /* Steuerung (Alle Apps, Einstellungen, Amazon) */
  .controls-icons { position: fixed; top: 3rem; right: 5rem; display: flex; }
  .ctl-icon { width: 3.6rem; height: 3.6rem; margin-left: .6rem; border-radius: 1rem; display: flex;
              align-items: center; justify-content: center; position: relative; }
  .ctl-icon svg { width: 1.7rem; height: 1.7rem; stroke: #fff; fill: none; stroke-width: 1.6; opacity: .85; }
  .ctl-icon .tip { position: absolute; top: 4.2rem; right: 0; white-space: nowrap; font-size: 1.1rem;
                   opacity: 0; text-shadow: 0 .1rem .6rem rgba(0,0,0,.5); }
  .ctl-icon.is-focused .tip { opacity: 1; }
  .controls-text { position: fixed; right: 6rem; bottom: 5rem; text-align: right; }
  .ctl-text { display: block; margin-left: auto; padding: .45rem 1rem; border-radius: .8rem; font-size: 1.25rem;
              opacity: .8; text-shadow: 0 .1rem .6rem rgba(0,0,0,.5); text-align: right; }

  /* Dock-Layout */
  .dock { position: fixed; left: 6rem; right: 6rem; bottom: 6.5rem; padding: .9rem; overflow: hidden; }
  .dock-row { display: flex; overflow-x: auto; scrollbar-width: none; }
  .dock-item { flex: 0 0 14.2rem; height: 9.6rem; border-radius: 1.2rem; display: flex; flex-direction: column;
               align-items: center; justify-content: center; border: .1rem solid transparent; }
  .dock-item .ico { width: 3.6rem; height: 3.6rem; border-radius: .9rem; }
  .dock-item .lbl { font-size: 1.35rem; margin-top: .9rem; white-space: nowrap; overflow: hidden;
                    text-overflow: ellipsis; max-width: 12.5rem; opacity: .92; }

  /* Listen-Layout */
  .list { position: fixed; left: 5rem; top: 10rem; bottom: 4rem; width: 52rem; overflow: hidden;
          -webkit-mask-image: linear-gradient(#000 72%, transparent); mask-image: linear-gradient(#000 72%, transparent); }
  .list-item { display: flex; align-items: center; padding: .3rem 1.6rem .5rem 1rem; margin-bottom: .2rem;
               border-radius: 1.2rem; font-size: 4rem; font-weight: 300; line-height: 1.2;
               text-shadow: 0 .1rem 1rem rgba(0,0,0,.35); border: .1rem solid transparent; }
  .list-item .ico { width: 2.4rem; height: 2.4rem; border-radius: .6rem; margin-right: 1.2rem; flex: none; }

  /* Fokus im Glas-Stil */
  .focusable.is-focused { background-color: rgba(255,255,255,.17); border-color: rgba(255,255,255,.28); }
  .ctl-text.is-focused, .ctl-icon.is-focused { opacity: 1; }
  .ctl-icon.is-focused svg { opacity: 1; }

  .letter { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.18);
            font-weight: 500; font-size: 1.5rem; color: #fff; }
  .list-item .letter { font-size: 1.2rem; }

  .empty-home { position: fixed; left: 6rem; bottom: 8rem; font-size: 1.5rem; opacity: .85;
                text-shadow: 0 .1rem .6rem rgba(0,0,0,.5); }

  /* Überlagerungen */
  .overlay { display: none; }
  .overlay.open { display: block; }
  #apps { background: rgba(9,11,16,.78); }
  #apps .scroll { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 4.5rem 6rem 8rem; }
  .ov-title { font-size: 2.4rem; font-weight: 400; margin-bottom: 2rem; }
  .apps-grid { display: grid; grid-template-columns: repeat(8, 1fr); grid-gap: .8rem; }
  .app-tile { position: relative; display: flex; flex-direction: column; align-items: center; padding: 1.4rem .4rem 1.2rem;
              border-radius: 1.2rem; border: .1rem solid transparent; }
  .app-tile .ico { width: 4.4rem; height: 4.4rem; border-radius: 1rem; }
  .app-tile .lbl { font-size: 1.1rem; margin-top: .8rem; max-width: 100%; white-space: nowrap; overflow: hidden;
                   text-overflow: ellipsis; opacity: .85; }
  .app-tile .dot { position: absolute; top: .9rem; right: 1.6rem; width: .6rem; height: .6rem; border-radius: 50%; background: #fff; }
  .hint { position: fixed; left: 6rem; bottom: 3rem; font-size: 1.15rem; opacity: .7; }
  .key { display: inline-block; border: .1rem solid rgba(255,255,255,.6); border-radius: 1rem; padding: 0 .6rem;
         margin-right: .5rem; font-size: 1rem; line-height: 1.6; }

  #settings { background: linear-gradient(90deg, rgba(9,11,16,.97) 0, rgba(9,11,16,.94) 42%, rgba(9,11,16,0) 62%); }
  .set-panel { position: absolute; left: 6rem; top: 4.5rem; width: 50rem; }
  .crumb { font-size: 1.1rem; opacity: .6; margin-bottom: .6rem; }
  .set-group { margin-top: 2.4rem; }
  .set-label { font-size: 1.1rem; opacity: .6; margin-bottom: .7rem; }
  .chips { display: flex; flex-wrap: wrap; }
  .chip { padding: .8rem 1.3rem; margin: 0 .6rem .6rem 0; border-radius: .9rem; font-size: 1.3rem;
          border: .1rem solid transparent; }
  .chip.selected { background: #fff; color: #11141b; }
  .chip.is-focused { border-color: rgba(255,255,255,.85); }
  .chip.selected.is-focused { box-shadow: 0 0 0 .25rem rgba(255,255,255,.35); }

  #sheet { background: rgba(5,6,10,.6); }
  .sheet-panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); min-width: 30rem;
                 padding: 1.6rem; border-radius: 1.6rem; background: rgba(28,31,40,.96);
                 border: .1rem solid rgba(255,255,255,.12); }
  .sheet-panel h3 { font-size: 1.5rem; font-weight: 500; margin: .2rem .4rem 1rem; }
  .opt { display: block; width: 100%; padding: .9rem 1.2rem; border-radius: .9rem; font-size: 1.3rem; border: .1rem solid transparent; }

  #toast { position: fixed; left: 50%; top: 3rem; transform: translateX(-50%); padding: .8rem 1.4rem;
           border-radius: 1rem; background: rgba(28,31,40,.92); font-size: 1.2rem; opacity: 0; transition: opacity .2s; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="bg" class="layer"></div>
<div id="shade" class="layer"></div>
<div id="home" class="layer"></div>

<div id="apps" class="layer overlay">
  <div class="scroll" id="appsScroll">
    <div class="ov-title">Alle Apps</div>
    <div class="apps-grid" id="appsGrid"></div>
  </div>
  <div class="hint"><span class="key">≡</span>Menütaste: zur Startseite hinzufügen oder entfernen</div>
</div>

<div id="settings" class="layer overlay">
  <div class="set-panel" id="setPanel"></div>
  <div class="hint"><span class="key">OK</span>Auswahl übernehmen</div>
</div>

<div id="sheet" class="layer overlay">
  <div class="sheet-panel"><h3 id="sheetTitle"></h3><div id="sheetOpts"></div></div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var bridge = window.Launcher || null;
  function $(id) { return document.getElementById(id); }

  /* ---------- Speicher ---------- */
  function load(key, fallback) {
    try {
      var raw = bridge ? bridge.getValue(key) : localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    var s = JSON.stringify(value);
    try { if (bridge) bridge.setValue(key, s); else localStorage.setItem(key, s); } catch (e) {}
  }

  var settings = load('settings', { layout: 'dock', bg: 'tal', glass: 'frost' });
  var apps = [], favs = [];
  var current = null, layerStack = [], returnFocus = [], sheetActions = [];

  var KNOWN = ['com.netflix.ninja', 'com.amazon.firebat', 'com.disney.disneyplus', 'com.amazon.firetv.youtube',
               'com.dazn', 'com.zdf.android.mediathek', 'com.spotify.tv.android', 'com.plexapp.android'];

  var MOCK = ['Netflix|com.netflix.ninja', 'Prime Video|com.amazon.firebat', 'Disney+|com.disney.disneyplus',
    'YouTube|com.amazon.firetv.youtube', 'ARD Mediathek|de.ard', 'ZDFmediathek|com.zdf.android.mediathek',
    'Joyn|de.joyn', 'RTL+|de.rtl', 'Spotify|com.spotify.tv.android', 'DAZN|com.dazn', 'Plex|com.plexapp.android',
    'Kodi|org.xbmc.kodi', 'Silk Browser|com.amazon.cloud9', 'Downloader|com.esaba.downloader'
  ].map(function (s) { var p = s.split('|'); return { name: p[0], pkg: p[1], img: '' }; });

  /* ---------- Hintergründe: einmal berechnet, inklusive Glas-Version ---------- */
  var W = 1280, H = 720;
  var SCENES = {
    tal: { name: 'Bergtal', seed: 7,
      sky: [[0, '#2c3b55'], [.55, '#7d8fa6'], [1, '#d9c3a1']], glow: [.62, .5, .5, 'rgba(255,226,180,.35)'],
      layers: [[.56, 330, .55, '#eef1f5', '#8995a3', .22], [.64, 280, .55, '#a7afb6', '#5d666e', .3],
               [.74, 170, .5, '#5f6a5c', '#373f35'], [.85, 90, .5, '#3a4030', '#22261d'],
               [.94, 50, .45, '#1d2119', '#111410']],
      haze: 'rgba(214,205,190,', trees: true },
    gipfel: { name: 'Blaue Gipfel', seed: 21,
      sky: [[0, '#4b6587'], [.6, '#9fb3cb'], [1, '#d5dfea']], glow: [.3, .2, .6, 'rgba(255,255,255,.25)'],
      layers: [[.50, 320, .55, '#f4f7fb', '#9fb2c8', .25], [.60, 280, .55, '#e2eaf3', '#7890ac', .25],
               [.70, 220, .52, '#b8c8da', '#56708f', .3], [.82, 160, .5, '#8aa0bb', '#3d5372', .3],
               [.94, 120, .48, '#5d7392', '#283850', .3]],
      haze: 'rgba(220,230,242,', trees: false },
    abend: { name: 'Abendrot', seed: 3,
      sky: [[0, '#2a2147'], [.5, '#a2557a'], [.85, '#f0986a'], [1, '#f7c58a']], glow: [.5, .6, .45, 'rgba(255,200,140,.55)'],
      layers: [[.62, 280, .55, '#9a6b92', '#6b4870'], [.70, 210, .52, '#6a4772', '#4a3254'],
               [.80, 130, .5, '#43304f', '#2f2139'], [.91, 70, .45, '#241a2d', '#18121f']],
      haze: 'rgba(240,160,140,', trees: true },
    nacht: { name: 'Nacht', seed: 11,
      sky: [[0, '#070a14'], [.6, '#16203a'], [1, '#2b3a5c']], glow: [.75, .2, .25, 'rgba(220,230,255,.25)'],
      layers: [[.64, 280, .55, '#46547a', '#1b2539', .25], [.76, 180, .5, '#1d2742', '#121a2c'],
               [.88, 90, .45, '#0e1424', '#0a0f1b']],
      haze: 'rgba(80,100,150,', trees: true, stars: true, moon: true }
  };
  var bgCache = {};
  var customPhoto = null;

  function rng(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

  /* Bergkamm: einzelne Gipfel plus feine Zacken */
  function ridge(r, base, amp, rough) {
    var n = 257, noise = new Array(n), pts = new Array(n), step = n - 1, a = amp * .22, i, k;
    noise[0] = 0; noise[n - 1] = 0;
    while (step > 1) {
      for (i = step / 2; i < n; i += step) noise[i] = (noise[i - step / 2] + noise[i + step / 2]) / 2 + (r() - .5) * a;
      step /= 2; a *= rough;
    }
    var peaks = [], count = 3 + Math.floor(r() * 4);
    for (k = 0; k < count; k++) peaks.push([r() * 1.2 - .1, .1 + r() * .3, amp * (.35 + r() * .65)]);
    for (i = 0; i < n; i++) {
      var t = i / (n - 1), hmax = amp * .08;
      for (k = 0; k < count; k++) {
        var d = 1 - Math.abs(t - peaks[k][0]) / peaks[k][1];
        if (d > 0) hmax = Math.max(hmax, peaks[k][2] * Math.pow(d, 1.35));
      }
      pts[i] = base - hmax + noise[i];
    }
    return pts;
  }

  function paintScene(ctx, sc) {
    var r = rng(sc.seed), i, g;
    g = ctx.createLinearGradient(0, 0, 0, H);
    sc.sky.forEach(function (s) { g.addColorStop(s[0], s[1]); });
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    if (sc.stars) {
      for (i = 0; i < 260; i++) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.2 + r() * 0.7) + ')';
        ctx.fillRect(r() * W, r() * H * .6, r() < .9 ? 1 : 2, r() < .9 ? 1 : 2);
      }
    }
    var gl = sc.glow, rg = ctx.createRadialGradient(gl[0] * W, gl[1] * H, 0, gl[0] * W, gl[1] * H, gl[2] * W);
    rg.addColorStop(0, gl[3]); rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    if (sc.moon) {
      ctx.fillStyle = '#e9edf5'; ctx.beginPath(); ctx.arc(gl[0] * W, gl[1] * H, 22, 0, Math.PI * 2); ctx.fill();
    }

    sc.layers.forEach(function (L, li) {
      var pts = ridge(r, L[0] * H, L[1], L[2]), n = pts.length, top = Math.min.apply(null, pts);
      var lg = ctx.createLinearGradient(0, top, 0, H);
      lg.addColorStop(0, L[3]); lg.addColorStop(L[5] || .35, L[4]); lg.addColorStop(1, L[4]);
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.moveTo(0, H);
      for (var k = 0; k < n; k++) ctx.lineTo(k / (n - 1) * W, pts[k]);
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

      if (sc.trees && li >= sc.layers.length - 2) {
        ctx.fillStyle = L[4];
        for (var x = 0; x < W; x += 4 + r() * 5) {
          var y = pts[Math.round(x / W * (n - 1))], h = 8 + r() * (li === sc.layers.length - 1 ? 34 : 16);
          ctx.beginPath(); ctx.moveTo(x - h * .22, y + 2); ctx.lineTo(x, y - h); ctx.lineTo(x + h * .22, y + 2); ctx.fill();
        }
      }
      if (li < sc.layers.length - 1) {
        var hz = ctx.createLinearGradient(0, L[0] * H - 40, 0, L[0] * H + 90);
        hz.addColorStop(0, sc.haze + '0)'); hz.addColorStop(.6, sc.haze + '.22)'); hz.addColorStop(1, sc.haze + '0)');
        ctx.fillStyle = hz; ctx.fillRect(0, L[0] * H - 40, W, 130);
      }
    });
  }

  function canvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  function blurOf(src) {
    var a = canvas(64, 36), b = canvas(256, 144), c = canvas(W, H);
    [a, b, c].forEach(function (cv) { var x = cv.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; });
    a.getContext('2d').drawImage(src, 0, 0, 64, 36);
    b.getContext('2d').drawImage(a, 0, 0, 256, 144);
    c.getContext('2d').drawImage(b, 0, 0, W, H);
    return c.toDataURL('image/jpeg', .8);
  }

  function getBackground(id) {
    if (id === 'foto' && !customPhoto) return getBackground('tal');
    if (bgCache[id]) return bgCache[id];
    var c = canvas(W, H), ctx = c.getContext('2d');
    if (id === 'foto' && customPhoto) {
      var s = Math.max(W / customPhoto.width, H / customPhoto.height);
      var w = customPhoto.width * s, h = customPhoto.height * s;
      ctx.drawImage(customPhoto, (W - w) / 2, (H - h) / 2, w, h);
    } else {
      paintScene(ctx, SCENES[id] || SCENES.tal);
    }
    bgCache[id] = { full: c.toDataURL('image/jpeg', .88), blur: blurOf(c) };
    return bgCache[id];
  }

  function applyBackground() {
    var b = getBackground(settings.bg);
    $('bg').style.backgroundImage = 'url(' + b.full + ')';
    document.body.className = (settings.layout === 'list' ? 'list-mode' : 'dock-mode') + (settings.glass === 'frost' ? ' frost' : '');
    placeGlass();
  }

  /* Glasflächen bekommen den passenden Ausschnitt des unscharfen Bildes */
  function placeGlass() {
    var els = document.querySelectorAll('.glass');
    var b = getBackground(settings.bg);
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (settings.glass !== 'frost') { el.style.backgroundImage = ''; continue; }
      var r = el.getBoundingClientRect();
      el.style.backgroundImage = 'linear-gradient(rgba(255,255,255,.09), rgba(255,255,255,.05)), url(' + b.blur + ')';
      el.style.backgroundSize = 'auto, ' + window.innerWidth + 'px ' + window.innerHeight + 'px';
      el.style.backgroundPosition = '0 0, ' + (-r.left) + 'px ' + (-r.top) + 'px';
    }
  }

  /* ---------- Icons ---------- */
  var SVG = {
    apps: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',
    amazon: '<svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h11v-9"/></svg>'
  };
  var CONTROLS = [['apps', 'Alle Apps'], ['settings', 'Einstellungen'], ['amazon', 'Amazon-Startseite']];

  function iconEl(app) {
    if (app.img) {
      var img = document.createElement('img'); img.className = 'ico'; img.src = app.img; img.alt = '';
      return img;
    }
    var d = document.createElement('span'); d.className = 'ico letter'; d.textContent = app.name.charAt(0);
    return d;
  }
  function el(tag, cls, attrs) {
    var e = document.createElement(tag); if (cls) e.className = cls;
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function byPkg(p) { for (var i = 0; i < apps.length; i++) if (apps[i].pkg === p) return apps[i]; return null; }

  /* ---------- Startseite ---------- */
  function renderHome() {
    var key = current && current.closest('#home') ? current.getAttribute('data-key') : null;
    var home = $('home'); home.innerHTML = '';
    var clock = el('div', 'clock', { id: 'clock' }); home.appendChild(clock); tick();

    var shown = favs.map(byPkg).filter(Boolean);
    if (settings.layout === 'list') {
      var list = el('div', 'list', { id: 'list' });
      shown.forEach(function (a) {
        var b = el('button', 'list-item focusable', { 'data-nav': '', 'data-action': 'launch', 'data-pkg': a.pkg, 'data-key': 'h:' + a.pkg });
        b.appendChild(iconEl(a)); b.appendChild(document.createTextNode(a.name)); list.appendChild(b);
      });
      home.appendChild(list);
      var ct = el('div', 'controls-text');
      CONTROLS.forEach(function (c) {
        var b = el('button', 'ctl-text focusable', { 'data-nav': '', 'data-action': c[0], 'data-key': 'c:' + c[0] });
        b.textContent = c[1]; ct.appendChild(b);
      });
      home.appendChild(ct);
    } else {
      var dock = el('div', 'dock glass'), row = el('div', 'dock-row');
      shown.forEach(function (a) {
        var b = el('button', 'dock-item focusable', { 'data-nav': '', 'data-action': 'launch', 'data-pkg': a.pkg, 'data-key': 'h:' + a.pkg });
        var l = el('span', 'lbl'); l.textContent = a.name;
        b.appendChild(iconEl(a)); b.appendChild(l); row.appendChild(b);
      });
      dock.appendChild(row);
      if (shown.length) home.appendChild(dock);
      var ci = el('div', 'controls-icons');
      CONTROLS.forEach(function (c) {
        var b = el('button', 'ctl-icon focusable', { 'data-nav': '', 'data-action': c[0], 'data-key': 'c:' + c[0] });
        b.innerHTML = SVG[c[0]] + '<span class="tip">' + c[1] + '</span>'; ci.appendChild(b);
      });
      home.appendChild(ci);
    }
    if (!shown.length) {
      var e = el('div', 'empty-home');
      e.textContent = 'Noch keine Apps auf der Startseite. Öffne „Alle Apps“ und drücke dort die Menütaste.';
      home.appendChild(e);
    }
    placeGlass();

    if (!layerStack.length) {
      setFocus((key && home.querySelector('[data-key="' + key + '"]')) || home.querySelector('[data-action="launch"]') ||
               home.querySelector('[data-nav]'), true);
    } else if (returnFocus.length) {
      // Fokus auf der Startseite merken, falls Elemente neu gebaut wurden
      var rf = returnFocus[0];
      if (rf && rf.closest && !document.body.contains(rf)) returnFocus[0] = home.querySelector('[data-key="' + (rf.getAttribute('data-key')) + '"]') || home.querySelector('[data-nav]');
    }
  }

  function tick() {
    var c = $('clock'); if (!c) return;
    c.textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }

  /* ---------- Alle Apps ---------- */
  function renderApps() {
    var key = current && current.closest('#apps') ? current.getAttribute('data-key') : null;
    var g = $('appsGrid'); g.innerHTML = '';
    apps.forEach(function (a) {
      var b = el('button', 'app-tile focusable', { 'data-nav': '', 'data-action': 'launch', 'data-pkg': a.pkg, 'data-key': 'a:' + a.pkg });
      var l = el('span', 'lbl'); l.textContent = a.name;
      b.appendChild(iconEl(a)); b.appendChild(l);
      if (favs.indexOf(a.pkg) > -1) b.appendChild(el('span', 'dot'));
      g.appendChild(b);
    });
    if (top() === 'apps') setFocus((key && g.querySelector('[data-key="' + key + '"]')) || g.querySelector('[data-nav]'), true);
  }

  /* ---------- Einstellungen ---------- */
  function renderSettings() {
    var key = current && current.closest('#settings') ? current.getAttribute('data-key') : null;
    var p = $('setPanel'); p.innerHTML = '<div class="crumb">Chillzimmer</div><div class="ov-title">Einstellungen</div>';
    var bgs = Object.keys(SCENES).map(function (k) { return [k, SCENES[k].name]; });
    if (customPhoto) bgs.push(['foto', 'Eigenes Foto']);
    var groups = [
      ['layout', 'Anordnung', [['dock', 'Dock'], ['list', 'Liste']]],
      ['bg', 'Hintergrund', bgs],
      ['glass', 'Material', [['frost', 'Frost'], ['clear', 'Klar']]]
    ];
    groups.forEach(function (gr) {
      var g = el('div', 'set-group'), lab = el('div', 'set-label'), chips = el('div', 'chips');
      lab.textContent = gr[1];
      gr[2].forEach(function (o) {
        var sel = settings[gr[0]] === o[0];
        var b = el('button', 'chip' + (sel ? ' selected' : ''), { 'data-nav': '', 'data-action': 'set', 'data-k': gr[0], 'data-v': o[0], 'data-key': 's:' + gr[0] + ':' + o[0] });
        b.textContent = o[1] + (sel ? '  ✓' : '');
        chips.appendChild(b);
      });
      g.appendChild(lab); g.appendChild(chips); p.appendChild(g);
    });
    if (top() === 'settings') setFocus((key && p.querySelector('[data-key="' + key + '"]')) || p.querySelector('.chip.selected'), true);
  }

  /* ---------- Ebenen ---------- */
  function top() { return layerStack[layerStack.length - 1] || null; }
  function openLayer(id) {
    returnFocus.push(current);
    layerStack.push(id);
    $(id).classList.add('open');
  }
  function closeLayer() {
    var id = layerStack.pop(); if (!id) return;
    $(id).classList.remove('open');
    var f = returnFocus.pop();
    if (!f || !document.body.contains(f)) f = scopeEl().querySelector('[data-nav]');
    setFocus(f, true);
  }
  function scopeEl() { return top() ? $(top()) : $('home'); }

  /* ---------- Fokus & Navigation ---------- */
  function setFocus(e, instant) {
    if (!e) return;
    if (current) current.classList.remove('is-focused');
    current = e; e.classList.add('is-focused');
    try { e.focus({ preventScroll: true }); } catch (x) {}
    var opts = { block: 'nearest', inline: 'nearest', behavior: instant ? 'auto' : 'smooth' };
    if (e.closest('#list') || e.closest('#apps')) opts.block = 'center';
    try { e.scrollIntoView(opts); } catch (x) { e.scrollIntoView(false); }
    document.body.scrollTop = 0;
  }

  function move(dir) {
    var els = scopeEl().querySelectorAll('[data-nav]');
    if (!current || !document.body.contains(current)) { setFocus(els[0]); return; }
    var best = pick(els, dir, true) || pick(els, dir, false);
    if (best) setFocus(best);
  }

  // strict: links/rechts nur in derselben Zeile; sonst nächstes Element in dieser Richtung
  function pick(els, dir, strict) {
    var r = current.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var best = null, bestScore = Infinity;
    for (var i = 0; i < els.length; i++) {
      var e = els[i]; if (e === current) continue;
      var b = e.getBoundingClientRect(), x = b.left + b.width / 2, y = b.top + b.height / 2, prim, sec;
      if (dir === 'left' || dir === 'right') {
        if (strict && (b.bottom < r.top || b.top > r.bottom)) continue;
        if (dir === 'left') { if (b.right > r.left + 1) continue; prim = r.left - b.right; }
        else { if (b.left < r.right - 1) continue; prim = b.left - r.right; }
        sec = Math.abs(y - cy);
      } else {
        if (!strict) return null;
        if (dir === 'up') { if (b.bottom > r.top + 1) continue; prim = r.top - b.bottom; }
        else { if (b.top < r.bottom - 1) continue; prim = b.top - r.bottom; }
        sec = Math.abs(x - cx);
      }
      var s = prim + sec * 2;
      if (s < bestScore) { bestScore = s; best = e; }
    }
    return best;
  }

  /* ---------- Aktionen ---------- */
  function ok() {
    if (!current) return;
    var a = current.getAttribute('data-action');
    if (a === 'launch') {
      var pkg = current.getAttribute('data-pkg');
      if (bridge) bridge.launch(pkg); else toast((byPkg(pkg) || { name: 'App' }).name + ' würde jetzt starten');
    } else if (a === 'apps') { openLayer('apps'); renderApps(); }
    else if (a === 'settings') { openLayer('settings'); renderSettings(); }
    else if (a === 'amazon') { if (bridge) bridge.openAmazonHome(); else toast('Öffnet die Amazon-Startseite'); }
    else if (a === 'set') {
      settings[current.getAttribute('data-k')] = current.getAttribute('data-v');
      save('settings', settings);
      applyBackground(); renderHome(); renderSettings();
    } else if (a === 'opt') {
      var fn = sheetActions[+current.getAttribute('data-i')];
      closeLayer(); if (fn) fn();
    }
  }

  function menu() {
    if (top() === 'sheet') { closeLayer(); return; }
    if (!current || current.getAttribute('data-action') !== 'launch') return;
    var pkg = current.getAttribute('data-pkg'), app = byPkg(pkg), i = favs.indexOf(pkg), opts = [];
    var onHome = !!current.closest('#home');
    if (i > -1) {
      if (onHome && i > 0) opts.push(['Weiter nach vorn', function () { swap(i, i - 1); }]);
      if (onHome && i < favs.length - 1) opts.push(['Weiter nach hinten', function () { swap(i, i + 1); }]);
      opts.push(['Von der Startseite entfernen', function () {
        favs.splice(i, 1); save('favs', favs); renderHome(); renderApps(); toast(app.name + ' entfernt');
      }]);
    } else {
      opts.push(['Zur Startseite hinzufügen', function () {
        favs.push(pkg); save('favs', favs); renderHome(); renderApps(); toast(app.name + ' hinzugefügt');
      }]);
    }
    opts.push(['Abbrechen', null]);
    openSheet(app.name, opts);
  }

  function swap(a, b) { var t = favs[a]; favs[a] = favs[b]; favs[b] = t; save('favs', favs); renderHome(); }

  function openSheet(title, opts) {
    openLayer('sheet');
    $('sheetTitle').textContent = title;
    var box = $('sheetOpts'); box.innerHTML = ''; sheetActions = [];
    opts.forEach(function (o, i) {
      var b = el('button', 'opt focusable', { 'data-nav': '', 'data-action': 'opt', 'data-i': i });
      b.textContent = o[0]; sheetActions.push(o[1]); box.appendChild(b);
    });
    setFocus(box.firstChild, true);
  }

  function back() {
    if (top()) { closeLayer(); return; }
    var first = $('home').querySelector('[data-action="launch"]');
    if (first && current !== first) setFocus(first);
  }

  var toastTimer;
  function toast(t) {
    var e = $('toast'); e.textContent = t; e.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { e.classList.remove('show'); }, 2000);
  }

  /* ---------- Daten von Fire OS ---------- */
  window.onApps = function (list) {
    apps = (list || []).slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'de'); });
    var saved = load('favs', null);
    if (saved) favs = saved.filter(byPkg);
    else { favs = KNOWN.filter(byPkg); save('favs', favs); }
    renderHome();
    if (top() === 'apps') renderApps();
  };

  /* ---------- Tasten ---------- */
  window.onRemote = function (k) {
    if (k === 'ok') ok(); else if (k === 'menu') menu(); else if (k === 'back') back(); else move(k);
  };
  document.addEventListener('keydown', function (e) {
    var map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                Enter: 'ok', Escape: 'back', Backspace: 'back', m: 'menu', ContextMenu: 'menu' };
    var k = map[e.key]; if (k) { e.preventDefault(); window.onRemote(k); }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-nav]') : null;
    if (t) { setFocus(t, true); ok(); }
  });
  window.addEventListener('resize', placeGlass);

  /* ---------- Start ---------- */
  // Eigenes Foto: Datei "hintergrund.jpg" in den assets-Ordner legen
  var photo = new Image();
  photo.onload = function () { customPhoto = photo; if (top() === 'settings') renderSettings(); if (settings.bg === 'foto') applyBackground(); };
  photo.src = 'hintergrund.jpg';

  applyBackground();
  setInterval(tick, 10000);
  if (bridge) bridge.requestApps(); else window.onApps(MOCK);
})();
</script>
</body>
</html>
